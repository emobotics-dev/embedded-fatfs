[package]
name = "embedded-fatfs"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mabezdev/embedded-fatfs"
readme = "README.md"
rust-version = "1.75"
keywords = ["fat", "filesystem", "no_std"]
categories = ["filesystem"]
license = "MIT"
description = """
FAT filesystem library.
"""
exclude = [
    "resources/*",
]

[features]
# Use Rust std library
std = ["embedded-io-async/std", "dep:tokio", "dep:embedded-io-adapters"]
# LFN (Long File Name) support
lfn = []
# Use dynamic allocation. When used without std please enable core_io/collections
alloc = []
# Full Unicode support. Disabling it reduces code size by avoiding Unicode-aware character case conversion
unicode = []
# enable log support
log = ["dep:log"]
# enable defmt support
defmt = ["dep:defmt"]
# panic when dropping dirty files, files should be flushed before hand
dirty-file-panic = []
# Produce cards that mount cleanly on standard FAT readers (Linux,
# Windows, macOS, fsck.fat). When enabled, `format_volume` zero-fills
# the FAT body even if `pre_erased` is set — an 0xFF-erased FAT body
# is interpreted by every standard reader as "all clusters allocated
# as end-of-chain" and would be reclaimed as lost clusters. Costs
# ~1 MB of writes per FAT copy (~60 s on a slow SPI bus for a 30 GB
# card). Default off — the embedded-fatfs mount tolerates the non-
# standard layout via `erased_byte(0xFF)`, so on-device read/write
# works fine without this.
host-compat = []

# Default features
default = ["chrono", "lfn", "unicode", "log"]

[dependencies]
# core deps
bitflags = "1.0"
embedded-io-async = "0.7.0"

# optional deps
embedded-io-adapters = { version = "0.7", package = "embedded-io-adapters", features = ["tokio-1"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
tokio = { version = "1", default-features = false, optional = true }
elain = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }

[dev-dependencies]
env_logger = "0.9"
embedded-fatfs = { path = ".", features = [ "std", "alloc" ] }
tokio = { version = "1", default-features = false, features = ["fs", "rt-multi-thread", "macros", "io-util"] }
anyhow = "1"
